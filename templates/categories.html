{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3">Catégories de produits</h1>
  <a class="btn btn-success" href="{{ url_for('categorie_ajouter') }}">+ Ajouter</a>
</div>
<div class="table-responsive">
<table class="table table-striped bg-white align-middle">
  <thead><tr><th>#</th><th>Libellé</th><th>Produits</th><th class="text-end">Actions</th></tr></thead>
  <tbody>
  {% for c in categories %}
    <tr>
      <td>{{ c.id_categorie }}</td><td>{{ c.libelle }}</td><td>{{ c.nb_produits }}</td>
      <td class="text-end">
        <a class="btn btn-sm btn-outline-primary" href="{{ url_for('categorie_modifier', id_categorie=c.id_categorie) }}">Modifier</a>
        <form method="post" action="{{ url_for('categorie_supprimer', id_categorie=c.id_categorie) }}" class="d-inline"
              onsubmit="return confirm('Supprimer cette catégorie ?');">
          <button class="btn btn-sm btn-outline-danger">Supprimer</button>
        </form>
      </td>
    </tr>
  {% else %}
    <tr><td colspan="4" class="text-center text-muted">Aucune catégorie.</td></tr>
  {% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
